<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self' https://azifpaxbeozfooydkzxh.supabase.co wss://azifpaxbeozfooydkzxh.supabase.co; manifest-src 'self'; upgrade-insecure-requests"
    />
    <title>Leo Personal Trainning</title>
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.json" />
    <!-- O iOS ignora o manifest e só olha para estas duas linhas ao adicionar
         o app à tela de início. Sem elas, o ícone vira uma miniatura da página. -->
    <link rel="apple-touch-icon" href="assets/icons/icone-180.png" />
    <meta name="apple-mobile-web-app-title" content="Leo Personal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/refinement.css" />
    <link rel="stylesheet" href="css/exercises.css" />
    <link rel="stylesheet" href="css/aluno.css" />
  </head>
  <body>
    <div class="app">
      <div class="devbar hidden" id="devbar"></div>

      <header class="topbar hidden" id="topbar">
        <div class="topbar-inner">
          <a class="brand" href="#/" id="brand">Leo Personal Trainning</a>
          <nav id="nav"></nav>
          <div class="topbar-conta">
            <button class="conta-botao" id="conta-botao" aria-haspopup="menu" aria-expanded="false" aria-controls="conta-menu">
              <span class="avatar avatar-conta" id="conta-avatar" aria-hidden="true"></span>
              <span class="conta-nome" id="conta-nome"></span>
              <span class="conta-seta" aria-hidden="true"></span>
            </button>
            <div class="conta-menu hidden" id="conta-menu" role="menu">
              <a class="conta-item" id="meu-cadastro" role="menuitem" href="#/aluno/perfil">Meu cadastro</a>
              <button class="conta-item hidden" id="instalar-app" role="menuitem">Instalar na tela inicial</button>
              <button class="conta-item" id="sair" role="menuitem">Sair</button>
            </div>
          </div>
        </div>
      </header>

      <div class="convite-instalar hidden" id="convite-instalar"></div>

      <main id="view"></main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
